<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal</title>

    <!-- 1. Add Bootstrap + Custom CSS inside <head> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: #1e293b;
        }
        .page-banner {
            background: linear-gradient(135deg, #0f172a, #2563eb);
            color: #ffffff;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
        }
        .job-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
        }
        .apply-btn {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- 2. Use those classes inside <body> -->
    <div class="container py-4">
        <div class="page-banner">
            <h1 class="h2 mb-1">Job Portal</h1>
            <p class="mb-0">Available Jobs</p>
        </div>

        <div class="row g-3">
            {% for job in jobs %}
                <div class="col-md-6">
                    <div class="job-card h-100">
                        <h2 class="h5 mb-2">{{ job.title }}</h2>
                        <p class="mb-1"><strong>Company:</strong> {{ job.company }}</p>
                        <p class="mb-1"><strong>Location:</strong> {{ job.location }}</p>
                        <p class="mb-3"><strong>Salary:</strong> ₹{{ job.salary }}</p>
                        <a href="{% url 'job_detail' job.id %}" class="apply-btn">View Details &amp; Apply</a>
                    </div>
                </div>
            {% empty %}
                <p>No jobs available right now.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
