<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal - All Jobs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">Job Portal</a>
        </div>
    </nav>

    <main class="container pb-5">
        <h1 class="h3 mb-4">Available Jobs</h1>

        <div class="row g-3">
            {% for job in jobs %}
                <div class="col-md-6">
                    <div class="card shadow-sm h-100">
                        <div class="card-body">
                            <h2 class="h5 card-title">
                                <a href="{% url 'job_detail' job.id %}" class="text-decoration-none">
                                    {{ job.title }}
                                </a>
                            </h2>
                            <p class="mb-1"><strong>Company:</strong> {{ job.company }}</p>
                            <p class="mb-1"><strong>Location:</strong> {{ job.location }}</p>
                            <p class="mb-3"><strong>Salary:</strong> ₹{{ job.salary }}</p>
                            <a href="{% url 'job_detail' job.id %}" class="btn btn-primary btn-sm">
                                View Details &amp; Apply
                            </a>
                        </div>
                    </div>
                </div>
            {% empty %}
                <div class="col-12">
                    <div class="alert alert-info">No jobs available right now.</div>
                </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
