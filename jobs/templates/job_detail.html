<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ job.title }} - Job Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">Job Portal</a>
            <a class="btn btn-outline-light btn-sm" href="{% url 'home' %}">← Back to Jobs</a>
        </div>
    </nav>

    <main class="container pb-5">
        <div class="row g-4">
            <div class="col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h1 class="h3 card-title mb-3">{{ job.title }}</h1>
                        <p class="mb-2"><strong>Company:</strong> {{ job.company }}</p>
                        <p class="mb-2"><strong>Location:</strong> {{ job.location }}</p>
                        <p class="mb-3"><strong>Salary:</strong> ₹{{ job.salary }}</p>
                        <hr>
                        <h2 class="h5">Job Description</h2>
                        <p class="mb-0">{{ job.description }}</p>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h4 card-title mb-3">Apply for this Job</h2>

                        {% if submitted %}
                            <div class="alert alert-success">
                                Your application has been submitted!
                            </div>
                        {% endif %}

                        <form method="post">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <button type="submit" class="btn btn-success w-100">Submit Application</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
